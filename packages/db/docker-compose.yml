name: Intelligent-QA-Assistant

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: Intelligent-QA-Assistant-postgres
    environment:
      POSTGRES_DB: Intelligent-QA-Assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - Intelligent-QA-Assistant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Intelligent-QA-Assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: Intelligent-QA-Assistant-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - Intelligent-QA-Assistant_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  Intelligent-QA-Assistant_postgres_data:
  Intelligent-QA-Assistant_minio_data:
